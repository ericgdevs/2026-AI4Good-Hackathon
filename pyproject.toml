[project]
name = "tpa-index"
version = "0.1.0"
description = "Searchable, staff-verified timeline of program videos"
readme = "README.md"
authors = [
    { name = "ericgdevs", email = "ericgdevs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "av>=19.0.2",
    "duckdb>=2.0.0",
    "emotiefflib>=1.1.1",
    "faster-whisper>=1.2.1",
    "gradio>=6.30.0",
    "huggingface-hub>=2.3.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
    "ultralytics>=8.4.184",
]

[project.scripts]
tpa-index = "tpa_index.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs locally cached model weights"]
addopts = "-m 'not slow'"

# Linux (UNF HPC, Blackwell): CUDA 13.0 torch wheels. macOS: default PyPI wheels (MPS).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
