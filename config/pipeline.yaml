window_s: 8
overlap_s: 2                   # must be < window_s
frames_per_window: 4           # >= 1
min_face_px: 48
label_threshold: 0.5            # global fallback; per-label values in label_thresholds
label_thresholds: {}            # {model name as in predictions.model: {label: t}}; config/thresholds.local.yaml wins
visual_groups: [category, actor, activity]
video_phases: [early, mid, showcase, unknown]
audio_sample_rate: 16000
moments:
  primary_group: activity
  secondary_groups: [category, actor, audio, expression]
  max_gap_windows: 1           # merge across gaps up to this many windows
  min_windows: 1               # drop moments shorter than this many windows
  close_ratio: 0.8             # uncertain_mixed if 2nd activity strength (score/threshold) >= this x top
  needs_review_margin: 0.2     # needs_review if confidence < threshold * (1 + margin), or any uncertain_mixed segment
overrides:                     # only window_s, overlap_s, frames_per_window allowed
  by_kind:
    clip: { window_s: 4, overlap_s: 1 }
  by_video: {}                 # e.g. v03: { frames_per_window: 8 }
models:
  main:
    hpc: google/siglip2-so400m-patch14-384   # used on cuda
    mac: google/siglip2-base-patch16-224     # used on mps/cpu
  motion:
    enabled: false
    id: microsoft/xclip-base-patch32
    labels: [dance, acting_theater]          # must be activity labels
    frames_per_window: 8                     # X-CLIP needs exactly its trained frame count
    other_prompt: "people doing some other activity"
  batch_windows: {cuda: 64, mps: 8, cpu: 4}
  # 004 signal stages: weights load from local files only (HF_HOME, or weights_dir() for GitHub assets)
  transcript:
    hpc: large-v3                # faster-whisper size; Systran/faster-whisper-<size> in HF_HOME
    mac: small                   # cached on the Mac; base/tiny are smaller if fetched
    hpc_device: cuda             # cpu = int8 on CPU; a cuda load failure stops with the missing library named
    compute_type: {cuda: float16, cpu: int8}
  audio:
    hpc: MIT/ast-finetuned-audioset-10-10-0.4593
    mac: MIT/ast-finetuned-audioset-10-10-0.4593
  people:                        # ultralytics/assets GitHub release; sha256 from scripts/download_weights.sh
    hpc: {file: yolo11m.pt, sha256: d5ffc1a674953a08e11a8d21e022781b1b23a19b730afc309290bd9fb5305b95}
    mac: {file: yolo11n.pt, sha256: 0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1}
  expression:
    face_detector:               # HF, pinned to one snapshot
      repo: opencv/face_detection_yunet
      file: face_detection_yunet_2023mar.onnx
      revision: 3cc26e7f1014a5ee5d74a42acee58bafc9d0a310
      sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
    model: {name: enet_b0_8_va_mtl, file: enet_b0_8_va_mtl.onnx, sha256: c43e056ad388d4a8dc911832b8291435b2af537f967e5870ebd731574ec7e812}   # EmotiEffLib GitHub, ONNX, CPU
signals:                         # 004: per-segment signals (observable cues only; no identity)
  people:
    person_conf: 0.4
  expression:
    face_score: 0.8              # YuNet score; minimum face size is min_face_px
    detect_max_side: 1280        # YuNet runs on a copy at most this long; min_face_px stays in source pixels
    mapping:                     # model class -> label; unlisted classes are dropped (Fear, Surprise)
      positive: [Happiness]
      neutral: [Neutral]
      negative: [Anger, Contempt, Disgust]
      upset: [Sadness]
  audio:
    mapping:                     # exact AudioSet display names; label score = max sigmoid over its classes
      singing_voice: [Singing, Choir, Male singing, Female singing, Child singing, Rapping, Humming, Chant]
      music: [Music]
      speech: [Speech, "Male speech, man speaking", "Female speech, woman speaking", "Child speech, kid speaking", Conversation, "Narration, monologue"]
      applause: [Applause, Clapping, Cheering]
      silence: [Silence]
insights:                        # 005 evaluate / insights (read-only; aggregates and IDs only)
  min_support: 5                 # labels with fewer eval positives: "too few to score"
  bootstrap: {resamples: 1000, block: 10, seed: 2026}   # block bootstrap over consecutive labeled segments per video
  failure_gallery: 20
  applause_after_s: 10           # applause within this many seconds after a performance counts as response
  audio_threshold: 0.5           # fixed AST probability for audio conditions (not the calibrated top-10% value)
  primary_like: [singing, lyricism_spoken_word, acting_theater, dance]   # "performing" primaries used by rules
  fusion:                        # "zero-shot + signal rules": drop a visual activity unless a condition holds
    - {label: singing, require_any: [{audio: singing_voice}, {audio: music}]}
    - {label: lyricism_spoken_word, require_any: [{audio: speech}, {has_speech: true}]}
  indicator_rules:               # signal-based estimates, always "model estimate (unvalidated)"; file order matters
    solo_on_stage:
      all: [{person_count: {eq: 1}}, {any: [{clears: performance}, {primary_in: primary_like}]}]
    group_performance:
      all: [{person_count: {gte: 2}}, {any: [{clears: performance}, {primary_in: primary_like}]}]
    voice_projection:
      all: [{any: [{indicator: solo_on_stage}, {indicator: group_performance}]},
            {any: [{audio: singing_voice}, {audio: speech}]}]
idle:
  prompts:
    - "an empty room"
    - "people setting up equipment before a show"
    - "people waiting around with nothing happening"
  score_threshold: 0.1           # fallback; per-model value from calibrate (thresholds.local.yaml) wins
  change_threshold: 0.02         # mean |frame diff| on 64x64 grayscale in 0-1; hand-set, never calibrated
  calibrate_top_pct: 20          # idle percentile, separate from labels (idle share differs from any label's)
calibrate:
  top_pct: 10                    # label thresholds: (100 - top_pct) percentile of dev scores
  min_threshold: 0.001           # absolute floor for label and idle thresholds (so400m: cos ~0.08, a weak-but-real match)
  null_group: "null"             # quoted: bare null is YAML for nothing. Scored by predict, never a result
  null_percentile: 99            # null floor = this percentile of each dev segment's max null score
  min_segments: 20               # fewer dev segments than this: keep the fallback
app:
  port: 7860                 # 127.0.0.1 only; tpa-index app refuses to start if the port is taken
  seed: 2026                 # blind sample seed; changing it never reshuffles an existing queue
  sample_size: 300           # main blind sample (all eval segments if fewer)
  overlap_size: 60           # first N of the main sample, for the second labeler
  rare_min_positives: 10     # a label is rare with fewer blind positives than this in the main sample
  topup_per_label: 20        # top-up cap per rare label
  padding_s: 3               # review playback context before and after a moment
  clip_height: 480           # clip resolution for playback (speed over detail)
  # label roles come from config, never from code (the vocabulary may change):
  blind_groups: [activity, category, actor, indicator]   # checklist groups, in this order
  indicator_groups: [indicator]    # labels in these groups are stored with role indicator
  uncertain_label: uncertain_mixed # the rules label offered as the uncertain/mixed option
  skip_observation: clip_unavailable   # observation type logged by Skip
